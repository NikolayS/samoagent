name: Cut production release tag

# Manual production release for the samohost deploy channel.
#
# samohost ships PROD only on a dated release tag matching
# (NikolayS/samohost src/commands/app.ts:1210):
#
#     ^v(\d{4})(\d{2})(\d{2})\.([1-9]\d*)$        e.g. v20260904.1
#
# and only when that tag is STRICTLY NEWER than the last deployed one, its SHA
# is an ancestor of `main`, and CI (.github/workflows/ci.yml, pinned by
# `releaseCiWorkflow` in .samohost.toml) is GREEN on that exact SHA.
#
# This workflow does all of that mechanically: pick today's date, take the next
# free `.N`, verify CI is green on origin/main HEAD, then cut the release from
# `main`. It creates no deployment itself — the samohost control plane polls,
# sees the new tag, and deploys within ~5 min.
#
# `.github/workflows/npm-publish.yml` has a guard job that recognises this tag
# shape and skips the npm publish it would otherwise trigger.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and validate the tag but do not create the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Cut vYYYYMMDD.N from main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve main HEAD
        id: head
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "main HEAD = $sha"

      - name: Verify CI is green on main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          # samohost gates the deploy on the CI workflow named by
          # `releaseCiWorkflow` in .samohost.toml (.github/workflows/ci.yml).
          # Refuse to cut a tag CI has not already greened on that SHA.
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {status, conclusion}]')"
          echo "CI runs for ${SHA}: $runs"
          total="$(printf '%s' "$runs" | jq 'length')"
          if [ "$total" -eq 0 ]; then
            echo "::error::No ci.yml run found for main HEAD ${SHA}. Wait for CI, then re-run."
            exit 1
          fi
          bad="$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed" or .conclusion != "success")] | length')"
          if [ "$bad" -ne 0 ]; then
            echo "::error::CI is not green on main HEAD ${SHA} (${bad}/${total} runs not successful)."
            exit 1
          fi
          echo "CI green on ${SHA} (${total} run(s))."

      - name: Compute next vYYYYMMDD.N
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          today="$(date -u +%Y%m%d)"

          # Strict-newer ordering key: (YYYYMMDD, N) with N zero-padded so it
          # compares numerically as one integer string.
          key() { printf '%s%09d\n' "${1:1:8}" "${1##*.}"; }

          # Existing deploy tags, in samohost's grammar only. Old npm tags
          # (v0.x, v1.2.3) never match and are ignored by the deploy channel.
          last="$(git tag --list 'v*' | grep -E '^v[0-9]{8}\.[1-9][0-9]*$' \
            | while read -r t; do echo "$(key "$t") $t"; done \
            | sort | tail -n 1 | cut -d' ' -f2 || true)"   # empty when no deploy tags exist yet

          # Next free N for today.
          n=1
          while git rev-parse -q --verify "refs/tags/v${today}.${n}" >/dev/null; do
            n=$((n + 1))
          done
          tag="v${today}.${n}"

          if [ -n "$last" ]; then
            echo "last deploy tag: $last"
            if [ "$(key "$tag")" -le "$(key "$last")" ]; then
              echo "::error::Computed tag ${tag} is not strictly newer than ${last} (clock skew or a future-dated tag)."
              exit 1
            fi
          else
            echo "no existing deploy tags — this is the first one"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $tag"

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target main \
            --title "$TAG" \
            --generate-notes
          echo "Created release $TAG. samohost polls every ~5 min; verify https://samograph.samo.team after the deploy."

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.head.outputs.sha }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Release tag \`$TAG\`"
            echo ""
            echo "- main HEAD: \`$SHA\`"
            echo "- dry run: \`$DRY\`"
            echo "- Runbook: \`docs/runbooks/deploy-release.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
